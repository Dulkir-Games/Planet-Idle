name: Code style

on:
  pull_request:
    paths:
      - '**.cs'
      - '.editorconfig'
      - 'Planet Idle.csproj'
      - '.github/workflows/code-style.yml'
  push:
      branches:
          - master

permissions:
  contents: read

jobs:
  editorconfig:
    name: EditorConfig (dotnet format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore "Planet Idle.csproj"

      - name: Verify formatting and style
        run: |
          dotnet format "Planet Idle.csproj" \
            --verify-no-changes \
            --verbosity diagnostic
