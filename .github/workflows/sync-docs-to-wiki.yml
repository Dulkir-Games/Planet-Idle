name: Sync docs to wiki

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push docs to wiki
        env:
          WIKI_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Dulkir-Games/Planet-Idle.wiki.git
        run: |
          git clone "$WIKI_URL" wiki
          rsync -av --delete docs/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Sync docs from ${GITHUB_SHA}"
          git push
